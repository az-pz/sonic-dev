[project]
name = "recodeagent-xcvrd"
version = "0.1.0"
description = "Multi-agent Python->Rust translation of SONiC xcvrd (ReCodeAgent-style, driven by GitHub Copilot CLI, orchestrated by Apache Burr)."
requires-python = ">=3.11"
dependencies = [
    "apache-burr>=0.42.0",
]

[project.optional-dependencies]
# Burr's telemetry tracker (pydantic) — enables .with_tracker + the `burr` UI's
# data. Lightweight; without it the pipeline still runs (tracker auto-disabled).
tracking = ["apache-burr[tracking]"]
# Burr's full telemetry UI server. Heavy (pyarrow); install separately where wheels exist.
ui = ["apache-burr[start]"]

[project.scripts]
recode = "orchestrator.app:main"

[tool.setuptools]
packages = ["orchestrator"]
