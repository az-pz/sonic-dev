transceivers:
  0:
    present: true
    defaults: &defaults
      SFF8024Identifier: "QSFP_DD"
      SFF8024IdentifierCopy: "QSFP_DD"
      VendorName: "xcvr-emu"
      VendorRev: "01"
      VendorOUI: 0x010203
      VendorSN: "0123456789"
      DateCode:
        Year: "24"
        Month: "12"
        DayOfMonth: "14"
      LengthMultiplier: "MULTIPLIER_100"
      BaseLength: 1
      CmisRevision:
        Major: 5
        Minor: 2
      MediaType: "OPTICAL_SMF"
      ModulePowerClass: "CLASS_8"
      MaxPower: 40
      BanksSupported: "BANKS_0_3_SUPPORTED"
      ConnectorType: "MPO_1X16"
      ModuleActiveFirmwareMajorRevision: 1
      ModuleActiveFirmwareMinorRevision: 2
      ModuleInactiveFirmwareMajorRevision: 1
      ModuleInactiveFirmwareMinorRevision: 1
      MemoryModel: "PAGED"
      MciMaxSpeed: "UP_TO_400_KHZ"
      # 40G application so it matches the DUT's Force10-S6000 40G/4-lane ports.
      # xcvrd matches app when host_lane_count==port_lanes AND
      # get_interface_speed(host_electrical_interface_id)==port_speed. HostInterfaceID
      # 0x06 = "XLAUI C2M (Annex 83B)" -> contains "XLAUI" -> 40000. Without a matching
      # app the port never reaches a terminal CMIS state and DOM stays disabled.
      ApplicationDescriptor:
        - HostInterfaceID: 6           # 0x06 XLAUI C2M (40G, 4x10G)
          MediaInterfaceID: 9          # 0x09 40GBASE-LR4 (SMF); media not matched by xcvrd
          HostLaneCount: 4
          MediaLaneCount: 4
          HostLaneAssignmentOptions: 0b1
      MediaLaneAssignmentOptions:
      - 0b0001
      MaxDurationDPInit: "BETWEEN_1_AND_5_S"
      OutputDisableTxSupported: "SUPPORTED"
      SteppedConfigOnly: "STEP_BY_STEP"
  1:
    present: true
    defaults: *defaults
