# Supervisor program for xcvrd, running inside pmon.
#
# The emulator (xcvr-emud) NO LONGER runs here — it runs as its own standalone
# Docker container on the DUT (see deploy_on_dut.sh) so it survives the SONiC
# `config reload` events that restart the pmon container. Only xcvrd is
# supervised inside pmon; it reaches the emulator over gRPC at localhost:50051
# (pmon and the emulator container both share the host network namespace).
#
# Dropped into /etc/supervisor/conf.d/xcvr-emu.conf. The pmon container's main
# supervisord config includes conf.d/*.conf, and pmon only regenerates its own
# supervisord.conf on start — so THIS file survives a container restart (config
# reload) and supervisord re-launches xcvrd automatically.
#
# PYTHONPATH is baked into the program's environment= so the bridge (and the
# xcvr_emu gRPC proto stubs it imports) in /opt/xcvr-emu-bridge are always on the
# import path, without touching pmon's system dist-packages. The command is the
# stock /usr/local/bin/xcvrd, unwrapped — we don't alter how xcvrd itself runs,
# we only export PYTHONPATH so it imports our sonic_platform bridge. Ordering
# with the emulator is handled by the fact that the emulator is an always-up
# standalone container plus autorestart=true (xcvrd retries until it connects).
#
# NOTE: a full container *recreation* (reboot / image change) wipes the writable
# layer (/opt + this file). Re-run the `emulator` deploy after such an event.

[program:xcvrd]
command=/usr/local/bin/xcvrd
environment=PYTHONPATH="/opt/xcvr-emu-bridge",XCVR_EMU_ADDR="localhost:50051"
priority=10
autostart=true
autorestart=true
startsecs=10
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/tmp/xcvrd.log
stderr_logfile=/tmp/xcvrd.log
