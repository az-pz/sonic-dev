# Supervisor programs for the xcvr-emu emulator + xcvrd, running inside pmon.
#
# Dropped into /etc/supervisor/conf.d/xcvr-emu.conf. The pmon container's main
# supervisord config includes conf.d/*.conf, and pmon only regenerates its own
# supervisord.conf on start — so THIS file survives a container restart (config
# reload) and supervisord re-launches both daemons automatically.
#
# PYTHONPATH is baked into each program's environment= so the bridge (and the
# emulator packages) in /opt/xcvr-emu-bridge are always on the import path,
# without touching pmon's system dist-packages.
#
# NOTE: a full container *recreation* (reboot / image change) wipes the writable
# layer (/opt + this file). Re-run the `emulator` deploy after such an event.

[program:xcvr-emud]
command=python3 -m xcvr_emu.xcvr_emud -c /etc/emu_config.yaml
environment=PYTHONPATH="/opt/xcvr-emu-bridge",XCVR_EMU_ADDR="localhost:50051"
priority=1
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/tmp/xcvr-emud.log
stderr_logfile=/tmp/xcvr-emud.log

[program:xcvrd]
command=/opt/xcvr-emu-bridge/start-xcvrd.sh
environment=PYTHONPATH="/opt/xcvr-emu-bridge",XCVR_EMU_ADDR="localhost:50051"
priority=10
autostart=true
autorestart=true
startsecs=10
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/tmp/xcvrd.log
stderr_logfile=/tmp/xcvrd.log
